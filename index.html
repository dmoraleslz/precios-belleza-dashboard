<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #ffffff; --border: #e4e2dc;
  --text: #1b1b19; --text-2: #55534e; --muted: #8a877f; --accent: #2a78d6;
  --row: #efeeea; --row-hover: #e7e5e0; --good: #0f7b3a; --good-row: #e1f3e7; --good-hover: #d2ecdb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1c1c1a; --border: #33332f;
    --text: #f3f2ee; --text-2: #c3c2b7; --muted: #8f8d85; --accent: #5598e7;
    --row: #232321; --row-hover: #2b2b28; --good: #5ccf8a; --good-row: #15301f; --good-hover: #1b3a26;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1c1c1a; --border: #33332f;
  --text: #f3f2ee; --text-2: #c3c2b7; --muted: #8f8d85; --accent: #5598e7;
  --row: #232321; --row-hover: #2b2b28; --good: #5ccf8a; --good-row: #15301f; --good-hover: #1b3a26;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);

.wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; margin-bottom: 16px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.sub { color: var(--text-2); font-size: 14px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--text-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
#q { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }
.cols, .item > .rowh { display: grid; grid-template-columns: minmax(0, 1fr) 96px 100px 120px 100px; gap: 12px; align-items: center; }
.group { margin-bottom: 22px; }
.ghead { display: flex; align-items: center; gap: 10px; width: 100%; font: inherit; color: var(--text); background: none;
  border: 0; border-bottom: 1px solid var(--border); padding: 6px 2px 8px; margin-bottom: 10px; cursor: pointer; text-align: left; }
.ghead h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.ghead .gmeta { color: var(--text-2); font-size: 13px; }
.ghead .chev { margin-left: auto; color: var(--muted); font-size: 13px; }
.ghead:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.group.closed .gbody { display: none; }
.spark { display: block; width: 96px; height: 28px; overflow: visible; }
.spark .ln { fill: none; stroke: var(--muted); stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
.spark .dot { fill: var(--muted); }
.spark .mn { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; }
.min > .rowh .spark .ln, .atmin-row .spark .ln { stroke: var(--good); }
.min > .rowh .spark .dot, .atmin-row .spark .dot { fill: var(--good); }
.cols { padding: 0 14px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.gbody { display: flex; flex-direction: column; gap: 6px; }
.item { border-radius: 10px; background: var(--row); overflow: hidden; }
.item.min { background: var(--good-row); }
.item > .rowh { width: 100%; font: inherit; color: inherit; text-align: left; background: none; border: 0;
  padding: 11px 14px; cursor: pointer; }
.item > .rowh:hover { background: var(--row-hover); }
.item.min > .rowh:hover { background: var(--good-hover); }
.item > .rowh:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.prod { font-weight: 600; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.prod::before { content: "▸"; color: var(--muted); font-size: 12px; transition: transform .15s; flex: none; }
.item.open .prod::before { transform: rotate(90deg); }
.best { font-weight: 700; font-size: 16px; }
.item.min .best { color: var(--good); }
a.best { color: inherit; text-decoration: none; border-radius: 4px; }
a.best:hover { text-decoration: underline; color: var(--accent); }
.item.min a.best { color: var(--good); }
.item.min a.best:hover { color: var(--good); }
.store { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hmin { color: var(--text-2); }
.detail { display: none; padding: 2px 14px 12px 34px; }
.item.open .detail { display: block; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 6px 0; border-bottom: 1px solid var(--border); }
td { padding: 7px 0; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: 0; }
th.num, td.num { padding-left: 12px; }
td.tr { width: 110px; padding-left: 12px; }
td a { color: var(--accent); text-decoration: none; }
td a:hover { text-decoration: underline; }
.tag { font-size: 12px; color: var(--muted); margin-left: 6px; }
.atmin { color: var(--good); font-weight: 600; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 620px) {
  .cols { display: none; }
  .item > .rowh { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "p g b" "s g m"; row-gap: 2px; column-gap: 10px; }
  .prod { grid-area: p; } .best { grid-area: b; } .store { grid-area: s; font-size: 13px; padding-left: 20px; }
  .item > .rowh > .spark { grid-area: g; width: 64px; }
  td.tr { width: 70px; } td.tr .spark { width: 64px; }
  .hmin { grid-area: m; font-size: 13px; } .hmin::before { content: "mín. "; }
  .detail { padding-left: 14px; }
}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const P = DATA.productos;
const clp = n => n == null ? '—' : '$' + n.toLocaleString('es-CL');
const SVG = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const dmy = f => f.slice(8, 10) + '-' + f.slice(5, 7);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

const [y, m, d] = DATA.actualizado.split('-');
document.getElementById('sub').textContent = `Precios del ${d}-${m}-${y} · ${P.length} productos`;
document.getElementById('foot').textContent = `Generado ${DATA.generado}. El mejor precio solo considera tiendas con stock. Haz clic en un producto para ver cada tienda.`;

// Gráfico de tendencia: serie [[fecha, precio], ...]; el eje X son todas las fechas del producto
// (así las líneas de cada tienda quedan alineadas). La línea punteada marca el mínimo.
function spark(serie, fechas) {
  const W = 96, H = 28, s = sv('svg', { class: 'spark', viewBox: `0 0 ${W} ${H}`, role: 'img' });
  const pts = serie.filter(x => x[1] != null);
  if (!pts.length) return s;
  const ps = pts.map(x => x[1]), lo = Math.min(...ps), hi = Math.max(...ps);
  const n = fechas.length, idx = new Map(fechas.map((f, i) => [f, i]));
  const X = f => n < 2 ? W / 2 : 3 + idx.get(f) * (W - 6) / (n - 1);
  const Y = v => hi === lo ? H / 2 : 3 + (hi - v) / (hi - lo) * (H - 6);
  const title = sv('title', {}); title.textContent = pts.map(x => `${dmy(x[0])}: ${clp(x[1])}`).join('\n');
  s.append(title);
  if (hi !== lo) s.append(sv('line', { class: 'mn', x1: 0, x2: W, y1: Y(lo), y2: Y(lo) }));
  if (pts.length > 1) s.append(sv('polyline', { class: 'ln', points: pts.map(x => X(x[0]) + ',' + Y(x[1])).join(' ') }));
  const last = pts[pts.length - 1];
  s.append(sv('circle', { class: 'dot', cx: X(last[0]), cy: Y(last[1]), r: 2.75 }));
  return s;
}

function detail(p) {
  const t = el('table');
  const hr = el('tr');
  hr.append(el('th', null, 'Tienda'), el('th', null, 'Tendencia'), el('th', 'num', 'Precio actual'), el('th', 'num', 'Mín. en la tienda'));
  const fechas = p.serie.map(x => x[0]);
  t.append(hr);
  p.tiendas.forEach(s => {
    const tr = el('tr', s.precio <= s.minimo ? 'atmin-row' : '');
    const td = el('td'), a = el('a', null, s.tienda);
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    td.append(a);
    if (!s.stock) td.append(el('span', 'tag', 'sin stock'));
    const cur = el('td', 'num' + (s.precio <= s.minimo ? ' atmin' : ''), clp(s.precio));
    const g = el('td', 'tr'); g.append(spark(s.serie, fechas));
    tr.append(td, g, cur, el('td', 'num', clp(s.minimo)));
    t.append(tr);
  });
  return t;
}

const items = new Map(P.map(p => {
  const it = el('section', 'item' + (p.mejor != null && p.mejor <= p.minimo ? ' min' : ''));
  // Fila clickeable (abre el detalle); el precio es un link directo a la tienda del mejor precio
  const b = el('div', 'rowh');
  b.tabIndex = 0; b.setAttribute('role', 'button'); b.setAttribute('aria-expanded', 'false');
  const best = el(p.url ? 'a' : 'span', 'num best', clp(p.mejor));
  if (p.url) {
    best.href = p.url; best.target = '_blank'; best.rel = 'noopener'; best.title = `Abrir en ${p.tienda}`;
    best.addEventListener('click', e => e.stopPropagation());
  }
  b.append(el('span', 'prod', p.producto), spark(p.serie, p.serie.map(x => x[0])), best,
           el('span', 'store', p.tienda || 'sin datos'), el('span', 'num hmin', clp(p.minimo)));
  const det = el('div', 'detail');
  const toggle = () => {
    if (!det.firstChild) det.append(detail(p));
    b.setAttribute('aria-expanded', it.classList.toggle('open'));
  };
  b.addEventListener('click', toggle);
  b.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === b) { e.preventDefault(); toggle(); } });
  it.append(b, det);
  return [p, it];
}));

// Una sección por persona (columna Persona de la pestaña Productos); se puede cerrar y se recuerda en este navegador
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const personas = [...new Set(P.map(p => p.persona || ''))].sort((a, b) => (a === '') - (b === '') || a.localeCompare(b, 'es'));
const groups = personas.map(per => {
  const g = el('section', 'group'), key = 'cerrado:' + per;
  const h = el('button', 'ghead'), body = el('div', 'gbody'), meta = el('span', 'gmeta'), chev = el('span', 'chev');
  h.append(el('h2', null, per || 'Sin asignar'), meta, chev);
  const set = closed => { g.classList.toggle('closed', closed); h.setAttribute('aria-expanded', !closed); chev.textContent = closed ? 'Mostrar ▾' : 'Ocultar ▴'; };
  set(store.get(key) === '1');
  h.addEventListener('click', () => { const c = !g.classList.contains('closed'); set(c); store.set(key, c ? '1' : '0'); });
  g.append(h, body);
  return { per, g, body, meta };
});

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = P.filter(p => !q || p.producto.toLowerCase().includes(q) || p.tiendas.some(t => t.tienda.toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.replaceChildren();
  groups.forEach(({ per, g, body, meta }) => {
    const mine = list.filter(p => (p.persona || '') === per);
    if (!mine.length) return;
    const verdes = mine.filter(p => p.mejor != null && p.mejor <= p.minimo).length;
    meta.textContent = `${mine.length} producto${mine.length === 1 ? '' : 's'} · ${verdes} en mínimo`;
    body.replaceChildren(...mine.map(p => items.get(p)));
    L.append(g);
  });
  if (!list.length) L.append(el('p', 'empty', 'Ningún producto coincide.'));
}
document.getElementById('q').addEventListener('input', render);
render();
</script>
