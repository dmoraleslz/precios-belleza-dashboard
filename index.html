.stores { list-style: none; margin: 0; padding: 0; }

.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .grid-l { stroke: var(--border); stroke-width: 1; }

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const P = DATA.productos;
const clp = n => n == null ? '—' : '$' + n.toLocaleString('es-CL');
const dmy = f => f.slice(8, 10) + '-' + f.slice(5, 7);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const SVG = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

P.forEach(p => {
  p.cambio = p.mejor != null && p.anterior != null ? p.mejor - p.anterior : null;
  p.vsProm = p.mejor != null && p.prom30 ? (p.mejor - p.prom30) / p.prom30 : null;
  p.enMinimo = p.mejor != null && p.serie.length > 1 && p.mejor <= p.minimo;
});

const [y, m, d] = DATA.actualizado.split('-');
document.getElementById('sub').textContent = `Precios del ${d}-${m}-${y} · ${P.length} productos`;
document.getElementById('foot').textContent = `Generado ${DATA.generado} desde data/historial.csv. El mejor precio solo considera tiendas con stock. Click en una tienda abre su página.`;

const kpis = [
  [P.length, 'productos seguidos'],
  [new Set(P.flatMap(p => p.tiendas.map(t => t.tienda))).size, 'tiendas'],
  [P.filter(p => p.cambio < 0).length, 'bajaron vs corrida anterior'],
  [P.filter(p => p.enMinimo).length, 'en su mínimo histórico'],
];
const K = document.getElementById('kpis');
kpis.forEach(([v, l]) => { const k = el('div', 'kpi'); k.append(el('b', null, v), el('span', null, l)); K.append(k); });

let filtro = 'todos';
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);

function badge(cls, txt) { return el('span', 'badge ' + cls, txt); }

function sparkline(serie) {
  const s = sv('svg', { class: 'spark', viewBox: '0 0 120 36', 'aria-hidden': 'true' });
  if (serie.length < 2) return s;
  const ps = serie.map(x => x.p), lo = Math.min(...ps), hi = Math.max(...ps), r = hi - lo || 1;
  const pts = serie.map((x, i) => [4 + i * 112 / (serie.length - 1), hi === lo ? 18 : 30 - (x.p - lo) / r * 24]);
  s.append(sv('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  const [lx, ly] = pts[pts.length - 1];
  s.append(sv('circle', { cx: lx, cy: ly, r: 3.5, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2 }));
  return s;
}

function chart(serie) {
  const box = el('div', 'chart');
  if (serie.length < 2) { box.append(el('p', 'note', 'Aún hay un solo día de datos; el gráfico aparece desde la segunda corrida.')); return box; }
  const W = 520, H = 200, L = 58, R = 12, T = 12, B = 26;
  const ps = serie.map(x => x.p);
  let lo = Math.min(...ps), hi = Math.max(...ps);
  const pad = (hi - lo) * 0.15 || hi * 0.05; lo = Math.max(0, lo - pad); hi += pad;
  const X = i => L + (serie.length === 1 ? 0 : i * (W - L - R) / (serie.length - 1));
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Mejor precio diario' });
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, yy = Y(v);
    s.append(sv('line', { class: 'grid-l', x1: L, x2: W - R, y1: yy, y2: yy }));
    const t = sv('text', { class: 'axis', x: L - 8, y: yy + 4, 'text-anchor': 'end' }); t.textContent = clp(Math.round(v / 10) * 10); s.append(t);
  }
  const step = Math.max(1, Math.ceil(serie.length / 6));
  serie.forEach((x, i) => {
    if (i % step && i !== serie.length - 1) return;
    const t = sv('text', { class: 'axis', x: X(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === serie.length - 1 ? 'end' : 'middle' });
    t.textContent = dmy(x.f); s.append(t);
  });
  s.append(sv('polyline', { points: serie.map((x, i) => X(i) + ',' + Y(x.p)).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
  const hair = sv('line', { y1: T, y2: H - B, stroke: 'var(--muted)', 'stroke-width': 1, 'stroke-dasharray': '3 3', visibility: 'hidden' });
  s.append(hair);
  const dot = sv('circle', { r: 4.5, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
  s.append(dot);
  const tip = el('div', 'tip');
  box.append(s, tip);
  const hide = () => { tip.style.display = 'none'; hair.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  s.addEventListener('pointermove', e => {
    const rc = s.getBoundingClientRect(), sx = rc.width / W, sy = rc.height / H;
    const vx = (e.clientX - rc.left) / sx;
    const i = Math.max(0, Math.min(serie.length - 1, Math.round((vx - L) / ((W - L - R) / (serie.length - 1)))));
    const x = serie[i];
    hair.setAttribute('x1', X(i)); hair.setAttribute('x2', X(i)); hair.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(x.p)); dot.setAttribute('visibility', 'visible');
    tip.replaceChildren(el('b', null, clp(x.p)), el('span', null, `${dmy(x.f)} · ${x.t}`));
    tip.style.display = 'block';
    const px = X(i) * sx, w = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, px - w / 2), rc.width - w) + 'px';
    tip.style.top = Math.max(0, Y(x.p) * sy - tip.offsetHeight - 12) + 'px';
  });
  s.addEventListener('pointerleave', hide);
  return box;
}

function storeList(p) {
  const ul = el('ul', 'stores');
  const max = Math.max(...p.tiendas.map(t => t.precio));
  p.tiendas.forEach(t => {
    const li = el('li', (t.url === p.url ? 'best' : '') + (t.stock ? '' : ' nostock'));
    const a = el('a'); a.href = t.url; a.target = '_blank'; a.rel = 'noopener';
    const bar = el('div', 'bar'); bar.style.width = Math.max(4, t.precio / max * 100) + '%';
    const val = el('span', 'val');
    if (t.normal && t.normal > t.precio) { val.append(el('s', null, clp(t.normal)), ' '); }
    val.append(clp(t.precio));
    a.append(el('span', 'st', t.tienda + (t.url === p.url ? ' ★' : '')), bar, val);
    const meta = el('div', 'meta');
    const bits = [];
    if (!t.stock) bits.push(['', 'sin stock']);
    if (t.tarjeta) bits.push(['', `${clp(t.tarjeta)} con ${t.tarjeta_nombre}`]);
    if (t.anterior != null && t.anterior !== t.precio) {
      const dlt = t.precio - t.anterior;
      bits.push([dlt < 0 ? 'down' : 'up', `${dlt < 0 ? '▼' : '▲'} ${clp(Math.abs(dlt))} vs anterior`]);
    }
    bits.forEach(([c, txt], i) => { if (i) meta.append(' · '); meta.append(el('span', c, txt)); });
    if (bits.length) a.append(meta);
    li.append(a); ul.append(li);
  });
  return ul;
}

function card(p) {
  const c = el('article', 'card');
  c.append(el('h2', 'name', p.producto));
  const row = el('div', 'row');
  const left = el('div');
  left.append(el('div', 'price', clp(p.mejor)));
  if (p.url) {
    const a = el('a', 'where', `en ${p.tienda} ↗`); a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
    left.append(a);
  }
  row.append(left, sparkline(p.serie));
  c.append(row);
  const b = el('div', 'badges');
  if (p.cambio < 0) b.append(badge('good', `▼ bajó ${clp(-p.cambio)}`));
  else if (p.cambio > 0) b.append(badge('bad', `▲ subió ${clp(p.cambio)}`));
  else if (p.cambio === 0) b.append(badge('', '= sin cambio'));
  if (p.vsProm != null) {
    const pct = Math.round(p.vsProm * 100);
    b.append(badge(pct < 0 ? 'good' : pct > 0 ? 'bad' : '', `${pct > 0 ? '+' : ''}${pct}% vs prom. 30d`));
  }
  if (p.enMinimo) b.append(badge('gold', '★ mínimo histórico'));
  else if (p.minimo != null && p.minimo < p.mejor) b.append(badge('', `mín. ${clp(p.minimo)}`));
  c.append(b);
  const tg = el('button', 'toggle', `Ver ${p.tiendas.length} tienda${p.tiendas.length === 1 ? '' : 's'} y evolución ▾`);
  tg.setAttribute('aria-expanded', 'false');
  const det = el('div', 'detail');
  let filled = false;
  tg.addEventListener('click', () => {
    if (!filled) {
      const s1 = el('div'), s2 = el('div');
      s1.append(el('h3', null, 'Hoy por tienda'), storeList(p));
      s2.append(el('h3', null, 'Mejor precio diario'), chart(p.serie));
      det.append(s1, s2); filled = true;
    }
    const open = c.classList.toggle('open');
    tg.setAttribute('aria-expanded', open);
    tg.textContent = open ? 'Ocultar ▴' : `Ver ${p.tiendas.length} tienda${p.tiendas.length === 1 ? '' : 's'} y evolución ▾`;
  });
  c.append(tg, det);
  return c;
}

const cards = new Map(P.map(p => [p, card(p)]));

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;
  let list = P.filter(p => !q || p.producto.toLowerCase().includes(q) || p.tiendas.some(t => t.tienda.toLowerCase().includes(q)));
  if (filtro === 'bajaron') list = list.filter(p => p.cambio < 0);
  if (filtro === 'minimo') list = list.filter(p => p.enMinimo);
  const key = { nombre: p => 0, cambio: p => p.cambio ?? 1e9, prom: p => p.vsProm ?? 1e9, precio: p => p.mejor ?? 1e12 }[sort];
  list = [...list].sort((a, b) => key(a) - key(b) || a.producto.localeCompare(b.producto, 'es'));
  const G = document.getElementById('grid');
  G.replaceChildren(...list.map(p => cards.get(p)));
  if (!list.length) G.append(el('p', 'empty', 'Ningún producto coincide.'));
}
render();
</script>
